#
# RFD66606-0065's taxonomy, as its own Fly.io app — a separate deploy
# target from weftspun_studio, the way taskweft/taskweft runs its own
# MCP server (RFD66606-0037). One machine. Its SQLite database keeps its
# pages in FoundationDB, so the machine needs no volume; the
# entrypoint reads FDB_CLUSTER_CONTENT and FDB_TLS_*_B64 secrets.

app = "weftspun-character-taxonomy"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"

# The headless-CMS JSON route and the static randomizer page.
[[services]]
  internal_port = 8080
  protocol = "tcp"

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [[services.ports]]
    port = 80
    handlers = ["http"]

  [[services.http_checks]]
    path = "/api/v1/health"
    interval = "15s"
    timeout = "5s"

# The MCP server RFD66606-0065's tools live behind.
[[services]]
  internal_port = 4001
  protocol = "tcp"

  [[services.ports]]
    port = 8443
    handlers = ["tls", "http"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
